services:
  rag-app:
    build: .
    container_name: rag-knowledge
    ports:
      - "8501:8501"
    volumes:
      - chroma_data:/app/chroma_db
      - docs_data:/app/docs
      - ./.env:/app/.env:ro
    environment:
      - DEFAULT_BACKEND=siliconflow
    profiles: [""]

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  docs_data:
  ollama_data:
